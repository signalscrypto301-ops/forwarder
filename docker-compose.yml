networks:
  app-network:
    driver: bridge
services:
  whatsapp-bot:
    build: ./Whatsapp
    ports:
      - "127.0.0.1:5426:5426"
    environment:
      - API_SECRET=forwarder_internal_secret_key_8f3a92b
      - PORT=5426
      - CLIENT_ID=user
    volumes:
      - ./Whatsapp/.baileys_auth:/app/.baileys_auth
      - ./Whatsapp/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5426/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
  telegram-bot:
    build: ./Telegram
    environment:
      - API_SECRET=forwarder_internal_secret_key_8f3a92b
      - WHATSAPP_SERVICE=http://whatsapp-bot:5426
    volumes:
      - ./Telegram:/app
    restart: unless-stopped
    depends_on:
      - whatsapp-bot
    command: sh -c "python bot.py"
    networks:
      - app-network

