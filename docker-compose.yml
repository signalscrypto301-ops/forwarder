networks:
  app-network:
    driver: bridge
services:
  whatsapp-bot:
    build: ./Whatsapp
    shm_size: 1gb
    ports:
      - "127.0.0.1:5426:5426"
    volumes:
      - ./Whatsapp/.wwebjs_auth:/app/.wwebjs_auth
      - ./Whatsapp/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5426/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
  telegram-bot:
    build: ./Telegram
    volumes:
      - ./Telegram:/app
    restart: unless-stopped
    depends_on:
      - whatsapp-bot
    command: sh -c "python bot.py"
    networks:
      - app-network
